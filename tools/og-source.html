<!DOCTYPE html>
<html lang="no"><head><meta charset="utf-8"><link rel="stylesheet" href="/fonts.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0F1830; font-family: 'Schibsted Grotesk', sans-serif; }
  .bg { position: absolute; inset: 0; background: url('/assets/story/neighbourhood-dusk-v4.jpg') center 45% / cover; }
  .grad { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(15,24,48,0.92) 0%, rgba(15,24,48,0.78) 42%, rgba(15,24,48,0.35) 72%, rgba(15,24,48,0.15) 100%), linear-gradient(180deg, rgba(15,24,48,0.4), transparent 40%, rgba(15,24,48,0.5)); }
  .t { position: absolute; left: 84px; top: 160px; width: 660px; color: #fff; }
  .brand { font-size: 108px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; }
  .brand span { color: #D4B17A; }
  h1 { margin: 20px 0 0; font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  p { margin: 16px 0 0; font-size: 21px; color: rgba(247,244,238,0.78); line-height: 1.4; max-width: 580px; }
  .card { position: absolute; right: 64px; top: 175px; width: 280px; padding: 24px 26px; border-radius: 24px; background: rgba(255,253,248,0.98); box-shadow: 0 40px 100px rgba(0,0,0,0.45); }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: #131E3A; max-width: 155px; }
  .ring-wrap { position: relative; width: 58px; height: 58px; flex: none; }
  .ring-score { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #131E3A; font-family: 'JetBrains Mono', monospace; }
  .legend { display: flex; flex-direction: column; gap: 7px; margin-top: 16px; font-size: 13px; }
  .legend div { display: flex; align-items: center; gap: 9px; color: #131E3A; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .card-cta { display: block; margin-top: 18px; font-size: 13.5px; font-weight: 600; color: #B0935F; }
</style></head>
<body>
  <div class="bg"></div><div class="grad"></div>
  <div class="t">
    <div class="brand">era<span>.</span></div>
    <h1>Boligeierskap uten gjetting.</h1>
    <p>Forstå boligen. Prioriter riktig. Gjør det som faktisk trengs. For boligeiere, styrer, håndverkere og faghandel.</p>
  </div>
  <div class="card">
    <div class="card-head">
      <div class="card-title">Eiendommens helsetilstand</div>
      <div class="ring-wrap">
        <svg width="58" height="58" viewBox="0 0 56 56">
          <circle cx="28" cy="28" r="24" fill="none" stroke="#EFEAE0" stroke-width="6"></circle>
          <circle cx="28" cy="28" r="24" fill="none" stroke="#B0935F" stroke-width="6" stroke-linecap="round" stroke-dasharray="101.03 150.80" transform="rotate(-90 28 28)"></circle>
        </svg>
        <div class="ring-score">67</div>
      </div>
    </div>
    <div class="legend">
      <div><span class="dot" style="background:#C0483A"></span>2 høy risiko</div>
      <div><span class="dot" style="background:#B0935F"></span>4 middels risiko</div>
      <div><span class="dot" style="background:#4C8A63"></span>8 ok</div>
      <div><span class="dot" style="background:#C7C2B6"></span>1 ikke vurdert</div>
    </div>
    <span class="card-cta">Se alle tiltak →</span>
  </div>
</body></html>
