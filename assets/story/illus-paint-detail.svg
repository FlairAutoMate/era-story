<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-label="Rulle mot nymalt vegg">
  <defs>
    <linearGradient id="wallOld" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F2EEE4"/><stop offset="1" stop-color="#EDE7DA"/></linearGradient>
    <linearGradient id="wallNew" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C1CBB9"/><stop offset="1" stop-color="#B2BEAA"/></linearGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#AEBBA6"/><stop offset="1" stop-color="#C6D0BE"/></linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8F8B82"/><stop offset="0.5" stop-color="#D9D6CE"/><stop offset="1" stop-color="#8F8B82"/></linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <pattern id="fur" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#B9C4B1"/><circle cx="3" cy="3" r="1.4" fill="#A9B5A1"/><circle cx="8" cy="8" r="1.4" fill="#C7D0BF"/></pattern>
  </defs>

  <!-- unpainted wall -->
  <rect width="1200" height="1100" fill="url(#wallOld)"/>
  <!-- faint old marks that the new coat covers -->
  <g fill="#E3DCCB" opacity="0.8"><circle cx="900" cy="300" r="7"/><rect x="960" y="520" width="90" height="4" rx="2"/><circle cx="1010" cy="760" r="5"/></g>

  <!-- painted area with a soft, slightly irregular wet edge -->
  <path d="M0 0 H 640 C 660 120, 610 220, 650 330 S 600 560, 655 690 S 620 900, 660 1100 H 0 Z" fill="url(#wallNew)"/>
  <path d="M640 0 C 660 120, 610 220, 650 330 S 600 560, 655 690 S 620 900, 660 1100 H 700 C 665 900, 700 560, 690 330 S 700 120, 680 0 Z" fill="url(#wet)" opacity="0.55"/>
  <!-- roller texture stripes on the fresh coat -->
  <g stroke="#B5C0AD" stroke-width="2" opacity="0.55">
    <path d="M40 80 V 1020"/><path d="M180 60 V 1040"/><path d="M330 90 V 1010"/><path d="M480 70 V 1030"/>
  </g>
  <!-- light from the left -->
  <rect width="1200" height="1100" fill="url(#wallOld)" opacity="0"/>
  <ellipse cx="120" cy="200" rx="260" ry="220" fill="#FFFFFF" opacity="0.14" filter="url(#soft)"/>

  <!-- skirting with masking tape -->
  <rect x="0" y="960" width="1200" height="140" fill="#E8E3D8"/>
  <rect x="0" y="960" width="1200" height="10" fill="#D9D2C2"/>
  <rect x="0" y="940" width="1200" height="26" fill="#F1E5C3"/>
  <rect x="0" y="940" width="1200" height="26" fill="none" stroke="#E2D4AA" stroke-width="2"/>

  <!-- roller mid-stroke at the edge -->
  <g transform="translate(700 470) rotate(-6)">
    <rect x="-70" y="-150" width="140" height="300" rx="70" fill="#131E3A" opacity="0.18" filter="url(#soft)" transform="translate(14 22)"/>
    <rect x="-64" y="-150" width="128" height="300" rx="64" fill="url(#fur)"/>
    <rect x="-64" y="-150" width="128" height="300" rx="64" fill="none" stroke="#A3AF9B" stroke-width="3"/>
    <rect x="-64" y="-150" width="40" height="300" rx="20" fill="#FFFFFF" opacity="0.18"/>
    <!-- axle and frame -->
    <rect x="60" y="-8" width="80" height="16" rx="8" fill="url(#chrome)"/>
    <path d="M136 0 C 190 0, 200 60, 200 120 L 200 220" fill="none" stroke="#2A3557" stroke-width="16" stroke-linecap="round"/>
    <!-- grip -->
    <rect x="172" y="210" width="56" height="200" rx="28" fill="#D4B17A"/>
    <rect x="186" y="230" width="10" height="150" rx="5" fill="#E2C48F" opacity="0.8"/>
    <!-- hand -->
    <g fill="#E8C9A8" stroke="#D5B08C" stroke-width="3">
      <rect x="150" y="300" width="100" height="120" rx="40"/>
      <rect x="150" y="285" width="34" height="60" rx="16"/>
    </g>
    <rect x="164" y="280" width="20" height="30" rx="10" fill="#2A3557"/>
  </g>

  <!-- fresh paint splatter -->
  <circle cx="612" cy="820" r="6" fill="#B9C4B1"/>
  <circle cx="586" cy="870" r="3" fill="#B9C4B1"/>
</svg>
