<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-label="Maling, sparkel, ruller, pensler og maskeringstape på tildekket gulv">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4DCCB"/><stop offset="1" stop-color="#EFE9DC"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDDAD2"/><stop offset="1" stop-color="#B9B5AB"/></linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C3CDBB"/><stop offset="1" stop-color="#AEBBA6"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#D2AE78"/><stop offset="1" stop-color="#B8925C"/></linearGradient>
    <pattern id="fur" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#EEE8DB"/><circle cx="2" cy="2" r="1.1" fill="#E1D9C8"/><circle cx="6" cy="6" r="1.1" fill="#E1D9C8"/></pattern>
  </defs>

  <!-- dust sheet -->
  <rect width="1200" height="1100" fill="url(#sheet)"/>
  <g stroke="#D6CDBA" stroke-width="2" fill="none" opacity="0.9">
    <path d="M0 240 C 260 210, 420 270, 700 235 S 1080 250, 1200 215"/>
    <path d="M0 620 C 180 650, 360 600, 620 640 S 980 610, 1200 650"/>
    <path d="M140 0 C 150 300, 100 600, 160 1100"/>
    <path d="M980 0 C 960 380, 1010 700, 970 1100"/>
  </g>
  <path d="M0 0 H1200 V70 C 900 95, 300 95, 0 70 Z" fill="#CFC5B1" opacity="0.7"/>

  <!-- masking tape roll (24 %, 32 %) -->
  <g transform="translate(288 352)">
    <ellipse cx="6" cy="14" rx="118" ry="112" fill="#8E846F" opacity="0.28" filter="url(#sh)"/>
    <circle r="112" fill="#F1E5C3"/>
    <circle r="112" fill="none" stroke="#E5D6AE" stroke-width="10"/>
    <circle r="58" fill="#EFE9DC"/>
    <circle r="58" fill="none" stroke="#D9CFBA" stroke-width="3"/>
    <path d="M-112 0 A112 112 0 0 1 -30 -108" fill="none" stroke="#FFF7DF" stroke-width="6" opacity="0.8"/>
  </g>
  <!-- strip of tape -->
  <path d="M60 560 L 250 540 L 254 566 L 64 586 Z" fill="#F1E5C3" stroke="#E2D4AA" stroke-width="2"/>

  <!-- spackle bucket (62 %, 40 %) -->
  <g transform="translate(744 440)">
    <ellipse cx="6" cy="14" rx="126" ry="120" fill="#8E846F" opacity="0.3" filter="url(#sh)"/>
    <circle r="120" fill="#F4F1EA" stroke="#D9D3C6" stroke-width="3"/>
    <circle r="100" fill="#FFFFFF" stroke="#E3DDD0" stroke-width="3"/>
    <path d="M-100 0 A100 100 0 0 1 0 -100 L 0 -70 A70 70 0 0 0 -70 0 Z" fill="#131E3A"/>
    <text x="-62" y="12" font-family="Schibsted Grotesk, Arial, sans-serif" font-size="22" font-weight="700" fill="#131E3A" letter-spacing="2">SPARKEL</text>
    <text x="-62" y="40" font-family="JetBrains Mono, monospace" font-size="16" fill="#8A8579">5 kg</text>
    <circle cx="70" cy="-70" r="9" fill="#D4B17A"/>
  </g>

  <!-- paint cans (30 %, 58 %) -->
  <g transform="translate(300 566)">
    <ellipse cx="8" cy="16" rx="104" ry="98" fill="#8E846F" opacity="0.3" filter="url(#sh)"/>
    <circle r="98" fill="#131E3A"/>
    <circle r="86" fill="url(#lid)"/>
    <circle r="54" fill="none" stroke="#9E9A91" stroke-width="3"/>
    <circle r="12" fill="#8C887F"/>
    <path d="M-98 0 A98 98 0 0 1 -60 -78" fill="none" stroke="#2A3557" stroke-width="10"/>
  </g>
  <g transform="translate(420 690)">
    <ellipse cx="8" cy="16" rx="104" ry="98" fill="#8E846F" opacity="0.32" filter="url(#sh)"/>
    <circle r="98" fill="#131E3A"/>
    <circle r="86" fill="url(#paint)"/>
    <path d="M-40 -30 C -10 -60, 40 -50, 50 -10 S 20 60, -30 40 S -70 0, -40 -30 Z" fill="#B9C4B1" opacity="0.7"/>
    <ellipse cx="-30" cy="-34" rx="20" ry="10" fill="#FFFFFF" opacity="0.35"/>
    <path d="M-98 0 A98 98 0 0 1 -60 -78" fill="none" stroke="#2A3557" stroke-width="10"/>
  </g>
  <!-- paint drip -->
  <path d="M470 780 C 500 770, 540 790, 520 806 S 470 800, 470 780 Z" fill="#B9C4B1" opacity="0.9"/>

  <!-- rollers (48 %, 74 %) -->
  <g transform="translate(576 814) rotate(-18)">
    <rect x="-140" y="-34" width="280" height="68" rx="34" fill="#8E846F" opacity="0.28" filter="url(#sh2)" transform="translate(6 10)"/>
    <rect x="-140" y="-34" width="280" height="68" rx="34" fill="url(#fur)" stroke="#D8CFBC" stroke-width="2"/>
    <rect x="-140" y="-34" width="120" height="68" rx="34" fill="#B9C4B1" opacity="0.55"/>
    <path d="M140 0 H 200 V 120" fill="none" stroke="#2A3557" stroke-width="10" stroke-linecap="round"/>
    <rect x="182" y="110" width="36" height="120" rx="18" fill="#D4B17A"/>
  </g>
  <g transform="translate(520 940) rotate(12)">
    <rect x="-110" y="-26" width="220" height="52" rx="26" fill="#8E846F" opacity="0.26" filter="url(#sh2)" transform="translate(6 10)"/>
    <rect x="-110" y="-26" width="220" height="52" rx="26" fill="url(#fur)" stroke="#D8CFBC" stroke-width="2"/>
    <path d="M110 0 H 160 V 90" fill="none" stroke="#2A3557" stroke-width="9" stroke-linecap="round"/>
    <rect x="145" y="82" width="30" height="100" rx="15" fill="#D4B17A"/>
  </g>

  <!-- brushes (74 %, 66 %) -->
  <g transform="translate(888 726)">
    <g transform="rotate(-32)">
      <rect x="-24" y="-190" width="48" height="380" rx="8" fill="#8E846F" opacity="0.25" filter="url(#sh2)" transform="translate(6 10)"/>
      <rect x="-20" y="-40" width="40" height="230" rx="18" fill="url(#wood)"/>
      <rect x="-26" y="-70" width="52" height="40" rx="4" fill="#B9B5AB"/>
      <rect x="-30" y="-190" width="60" height="125" rx="6" fill="#E7DFCF"/>
      <path d="M-30 -190 H30 L 26 -140 H -26 Z" fill="#B9C4B1"/>
      <circle cy="170" r="6" fill="#131E3A"/>
    </g>
    <g transform="translate(70 40) rotate(-14)">
      <rect x="-16" y="-160" width="32" height="320" rx="8" fill="#8E846F" opacity="0.25" filter="url(#sh2)" transform="translate(6 10)"/>
      <rect x="-14" y="-30" width="28" height="190" rx="14" fill="#131E3A"/>
      <rect x="-20" y="-56" width="40" height="32" rx="4" fill="#B9B5AB"/>
      <rect x="-22" y="-160" width="44" height="110" rx="6" fill="#E7DFCF"/>
      <circle cy="145" r="5" fill="#D4B17A"/>
    </g>
    <g transform="translate(150 -20) rotate(4)">
      <rect x="-30" y="-140" width="60" height="300" rx="8" fill="#8E846F" opacity="0.25" filter="url(#sh2)" transform="translate(6 10)"/>
      <rect x="-24" y="-20" width="48" height="180" rx="20" fill="url(#wood)"/>
      <rect x="-32" y="-52" width="64" height="38" rx="4" fill="#B9B5AB"/>
      <rect x="-38" y="-140" width="76" height="96" rx="6" fill="#E7DFCF"/>
    </g>
  </g>

  <!-- stir stick + rag -->
  <rect x="820" y="930" width="240" height="18" rx="9" fill="#D2AE78" transform="rotate(-8 940 939)"/>
  <path d="M60 880 C 120 820, 220 850, 240 900 S 160 1000, 90 960 S 20 930, 60 880 Z" fill="#FFFFFF" opacity="0.8"/>
</svg>
